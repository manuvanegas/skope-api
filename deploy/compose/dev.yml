services:
  server:
    build:
      args:
        ENVIRONMENT: dev
    image: openskope/skope-api:dev
    volumes:
      - ./timeseries/app:/code/app
      # The release named in deploy/metadata/dev.yml (exported by the Makefile).
      - ${DATASET_RELEASE_ROOT:-./cog-input}:/data:ro
      - ./deploy/settings/dev.yml:/code/config/app_settings.yml:ro
      - ./deploy/colormaps/custom.json:/code/config/colormaps.json:ro
    ports:
      - "127.0.0.1:8001:8000"
  titiler:
    volumes:
      - ${DATASET_RELEASE_ROOT:-./cog-input}:/data:ro
