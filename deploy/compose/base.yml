services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      titiler:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      - internal_geospatial_net # Internal network to see Titiler
      - default # External access to reach S3 and serve the frontend
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_geospatial_net

  titiler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.titiler
    image: openskope/skope-api-titiler:latest
    restart: always
    environment:
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.ovr
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      AWS_NO_SIGN_REQUEST: YES
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 80), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      # Titiler is ONLY on the internal network.
      - internal_geospatial_net

  ingest:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingest
      # Without a target, Docker builds the last stage (tests), which runs pytest.
      target: runtime
    image: openskope/skope-api-ingest:latest
    profiles:
      - ingest
    environment:
      AWS_NO_SIGN_REQUEST: YES
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.ovr
      DATASET_METADATA_DIR: /ingest/datasets
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      INPUT_MANIFEST_PATH: /ingest/manifests/paleocar_v3.yml
      OUTPUT_DIR: /output/paleocar_v3
    volumes:
      # Dataset files and manifests are read-only inputs; edits apply without a rebuild.
      - ./deploy/metadata/datasets:/ingest/datasets:ro
      - ./timeseries/ingest/manifests:/ingest/manifests:ro
      - ./cog-input:/data
      - ./timeseries/ingest/output:/output

  ingest-test:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingest
      target: test
    profiles:
      - test

networks:
  internal_geospatial_net:
    driver: bridge
