# The staging environment: `release` is the data release mounted at /data, whose
# <dataset_id>/dataset-facts.json files hold the facts observed in the processed data;
# `datasets` lists, in order, what the environment publishes. Each dataset and all
# of its variables are described in datasets/<id>.yml. The image build merges them
# into /code/metadata.yml (python -m app.registry_build).
#
# `release` is an unquoted absolute path on the host, and that directory must never
# change once a commit names it. No release has been migrated yet: set it to the
# migrated release before deploying (see docs/data-preparation.md).
release:
datasets:
  - id: lbda_v2
    variables: [pmdi]
  - id: srtm
    variables: [srtm_elevation]
  - id: paleocar_v2
    variables: [ppt_water_year, gdd_may_sept, maize_farming_niche]
  - id: paleocar_v3
    variables: [ppt_annual, gdd_cotton_annual]
