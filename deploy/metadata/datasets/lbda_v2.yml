variables:
  - id: pmdi
    class: Drought
    name: Palmer Modified Drought Index
    units:
    wmsLayer: 'SKOPE:lbda_v2_pmdi_${year}'
    visible: false
    styles: default
    timeseriesServiceUri: lbda_v2/pmdi
    description: >-
      Palmer’s Modified Drought Index: Negative values indicate dry conditions;
      positive values indicate wet conditions.
      -5=Exceptional Dry, 0=Normal, 5=Exceptional Wet;
      Jun–Aug.; <=-4.00 extreme drought; -3.00 to-3.99 severe drought;
      -2.00 to -2.99 moderate dought, -1.99 to 1.99 midrange;
      2.00 to 2.99 moderately moist; 3.00 to 3.99 very moist;
      >=4.00 extremely moist.
sourceUrl: 'https://www.ncdc.noaa.gov/paleo-search/study/22454'
