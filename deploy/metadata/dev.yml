# The dev environment: `release` is the data release mounted at /data, whose
# <dataset_id>/dataset-facts.json files hold the facts observed in the processed data;
# `datasets` lists, in order, what the environment publishes. Each dataset and all
# of its variables are described in datasets/<id>.yml. The image build merges them
# into /code/metadata.yml (python -m app.registry_build). Development builds skip
# datasets and variables that have not been processed yet.
release: ./cog-input
datasets:
  - id: paleocar_v3
    variables: [ppt_annual, gdd_cotton_annual]
